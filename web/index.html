<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffd8d9">
<title>허니츄러스와 과메기단의 습격</title>
<style>
@font-face{font-family:'Black Han Sans';src:url(fonts/BlackHanSans-Regular.ttf) format('truetype');font-display:swap}
@font-face{font-family:'Jua';src:url(fonts/Jua-Regular.ttf) format('truetype');font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at 20% 10%,#fff9f5,#ffe8ed 60%,#ffd8d9);color:#5b3440;font-family:'Jua','Malgun Gothic',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center}
#shell{position:relative;width:min(96vw,169vh);aspect-ratio:16/9;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px #9b5d7b33,0 0 0 6px #fff8f5aa;background:#fff0f2}
#shell:fullscreen{width:100vw;height:100vh;border-radius:0;display:grid;place-items:center}
#shell:fullscreen canvas{width:min(100vw,177.7778vh);height:auto;aspect-ratio:16/9}
canvas{touch-action:none;display:block;width:100%;height:100%;outline:none}
#loading{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;background:#fff8f5;color:#5b3440;font-size:26px;gap:18px}
#loading b{font-family:'Black Han Sans','Malgun Gothic',sans-serif;font-weight:400;font-size:44px;color:#ef7f9e;letter-spacing:1px}
#loading span{font-size:15px;color:#a8707f}
#track{width:min(420px,60vw);height:14px;border-radius:7px;background:#ffe4e9;overflow:hidden;box-shadow:inset 0 0 0 2px #f2c4cf}
#bar{width:0;height:100%;background:linear-gradient(90deg,#ffc94d,#ef7f9e);transition:width .2s}
#access{position:absolute;left:-10000px}
#full{position:absolute;top:10px;left:50%;transform:translateX(-50%);border:1px solid #ffffffcc;border-radius:20px;background:#fff8f5cc;color:#a8707f;padding:5px 12px;font:12px 'Jua','Malgun Gothic',sans-serif;cursor:pointer;opacity:.0;transition:opacity .2s}
#shell:hover #full{opacity:.9}
#full:focus-visible{opacity:1;outline:3px solid #ef7f9e}
@media(max-width:700px){#shell{width:100vw;border-radius:0;box-shadow:none}}
</style></head><body><main id="shell">
<canvas id="game" width="1280" height="720" tabindex="0" role="application" aria-label="허니츄러스 런앤건 게임. Enter 선택, 방향키 이동과 조준, Z 사격, X 또는 Space 점프, C 수류탄, Q 무기 교체, Escape 일시정지."></canvas>
<div id="loading"><b>HONEY CHURROS</b>허니비 구출 작전 준비 중…<div id="track"><div id="bar"></div></div><span>캐릭터와 꿀 저장고를 불러오고 있어요</span></div>
<button id="full" aria-label="전체 화면">⛶ 전체 화면</button><p id="access" aria-live="polite"></p>
</main><script src="game.js"></script><script src="music/tracks.js"></script><script src="audio.js"></script><script src="visuals.js"></script><script src="render.js"></script></body></html>
