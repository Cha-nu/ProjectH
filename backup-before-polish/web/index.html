<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>허니츄러스와 과메기단의 습격</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#241c23;color:#fff4db;font-family:'Malgun Gothic',system-ui,sans-serif}body{display:grid;place-items:center}#shell{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;box-shadow:0 20px 100px #0009}canvas{touch-action:none;display:block;width:100%;height:100%;outline:none}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#fff4db;color:#39272d;font-size:22px;gap:20px}#loading span{font-size:14px;color:#80676c}#loading i{margin:auto;width:42px;height:42px;border:4px solid #ead8b2;border-top-color:#ef91aa;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#access{position:absolute;left:-10000px}button:focus-visible{outline:3px solid #ef91aa}#full{position:absolute;bottom:12px;right:13px;border:1px solid #ffffff35;border-radius:8px;background:#39272dbb;color:#fff4db;padding:7px 12px;font:12px inherit;cursor:pointer}#full:hover{background:#80676c}
html,body{background:radial-gradient(ellipse at 20% 10%,#fff9f5,#ffe8ed 60%,#ffd8d9);color:#69444f}#shell{width:min(96vw,169vh);border-radius:28px;overflow:hidden;box-shadow:0 24px 70px #9b5d7b26,0 0 0 6px #fff8f5aa}#shell:fullscreen{width:100vw;height:100vh;border-radius:0;background:#fff0f2;display:grid;place-items:center}#shell:fullscreen canvas{width:min(100vw,177.7778vh);height:auto;aspect-ratio:16/9}#loading{background:#fff8f5;color:#69444f}#loading i{border-color:#ffe4e9;border-top-color:#dc8da7}#full{top:14%;bottom:auto;right:2%;padding:6px 11px;border:1px solid #ffffffcc;border-radius:20px;background:#fff8f5e8;color:#967481;font:11px 'Malgun Gothic',sans-serif;box-shadow:0 3px 8px #69444f12;transition:background .15s,transform .15s}#full:hover{background:#ffd8d9;transform:translateY(-1px)}#full:active{transform:translateY(1px)}@media(max-width:700px){#shell{width:100vw;border-radius:0;box-shadow:none}#full{font-size:9px;padding:4px 8px}}
</style></head><body><main id="shell"><canvas id="game" width="1280" height="720" tabindex="0" role="application" aria-label="허니츄러스 런앤건 게임. Enter 시작, 방향키 이동, Z 사격, X 또는 Space 점프, C 수류탄, Q 무기 교체, Escape 일시정지."></canvas><div id="loading"><i></i>허니비 구출 작전 준비 중…<span>캐릭터와 꿀 저장고를 불러오고 있어요.</span></div><button id="full" aria-label="전체 화면">⛶ 전체 화면</button><p id="access" aria-live="polite"></p></main><script src="game.js"></script><script src="render.js"></script></body></html>
